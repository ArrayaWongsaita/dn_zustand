name: Course readiness
on:
  workflow_dispatch:
  push:
    branches: [main, 'integration/**']
  pull_request:
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:course
      - run: npm run check:course
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-readiness-${{ github.sha }}
          path: course/readiness/
